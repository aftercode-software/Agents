interface:
  display_name: "Preparador de Harness"
  short_description: "Convierte relevamientos en harness SDD por proyecto."
  default_prompt: "Usa $aftercode-harness-preparer para preparar el harness desde el relevamiento y harness-base. Para frontend, pide referencias técnicas/documentales y visuales, copia íntegros agentes, skills y documentos reutilizables, y verifica las rutas y el contenido. Conserva fuentes e IDs, crea feature list y DER, y registra pendientes."
